<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Country Cash Queen - Christmas Edition</title>
  <style>
    body {
      font-family: "Quicksand", "Trebuchet MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: transparent;
      user-select: none;
      overflow: hidden;
    }

    .game-wrap {
      position: relative;
      width: 310px;
      height: 430px;
      border-radius: 26px;
      overflow: hidden;
      background: linear-gradient(180deg, #1b4332 0%, #2d6a4f 52%, #d8f3dc 88%, #ffffff 100%);
      border: 3.5px solid #ffd166;
      box-shadow: 0 12px 28px rgba(155, 34, 38, 0.3);
      touch-action: none;
      transition: box-shadow 0.15s ease;
      flex-shrink: 0;
    }

    .game-wrap.hurt {
      box-shadow: 0 0 0 4px #e63946, 0 12px 28px rgba(230, 57, 70, 0.55);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      font-size: 12px;
      color: #9b2226;
      z-index: 2;
    }

    .pill {
      background: rgba(255, 255, 255, 0.95);
      padding: 5px 9px;
      border-radius: 14px;
      border: 2px solid #ffd166;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      pointer-events: none;
      white-space: nowrap;
    }

    .mute-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #ffd166;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      padding: 0;
      flex-shrink: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 250, 250, 0.95);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #9b2226;
      z-index: 3;
    }

    .badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #1b4332;
      background: #d8f3dc;
      border: 1.5px solid #52b788;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .overlay h2 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #9b2226;
    }

    .rules {
      background: #fff;
      border: 2px solid #ffd166;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13.5px;
      line-height: 1.6;
      font-weight: 700;
    }

    .rules .good { color: #1b4332; }
    .rules .bonus { color: #b5651d; }
    .rules .bad  { color: #d90429; }
    .rules .tip  {
      color: #2d6a4f;
      font-size: 13px;
      line-height: 1.45;
      margin-top: 6px;
    }

    .btn {
      background: linear-gradient(135deg, #d90429, #9b2226);
      color: #fff;
      border: 2px solid #ffd166;
      padding: 10px 26px;
      border-radius: 22px;
      font-family: inherit;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(155, 34, 38, 0.35);
      transition: transform 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="game-wrap" id="wrap">
    <div class="hud">
      <div class="pill">🎄 $<span id="score">0</span></div>
      <div class="pill">Lv <span id="levelNum">1</span>/5</div>
      <div class="pill" id="lives">❤️❤️❤️</div>
      <button class="mute-btn" id="muteBtn" type="button" title="Toggle Music">🔊</button>
    </div>

    <canvas id="game" width="310" height="430"></canvas>

    <div class="overlay" id="overlay">
      <div class="badge">🎅 North Country Cash Queen 🎄</div>
      <h2>Christmas Cash Catch</h2>
      <div class="rules">
        <div class="good">✅ Catch every 💵 $10 Note</div>
        <div class="bonus">✨ Rare 👑 $50 Queen Crown</div>
        <div class="bad">❌ Dodge the 🚫 Debt</div>
        <div class="tip">Save $500 per level across 5 festive challenges!</div>
      </div>
      <button class="btn" id="startBtn" type="button">Play Level 1</button>
    </div>
  </div>
  <script>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("wrap");
      const overlay = document.getElementById("overlay");
      const scoreEl = document.getElementById("score");
      const levelEl = document.getElementById("levelNum");
      const livesEl = document.getElementById("lives");
      const startBtn = document.getElementById("startBtn");
      const muteBtn = document.getElementById("muteBtn");

      function fitFrame() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        if (vw > 0 && vh > 0 && (vw < 320 || vh < 440)) {
          const s = Math.min((vw - 8) / 310, (vh - 8) / 430, 1);
          wrap.style.transform = "scale(" + s + ")";
          wrap.style.transformOrigin = "center center";
        } else {
          wrap.style.transform = "";
        }
      }
      fitFrame();
      window.addEventListener("resize", fitFrame);

      let running = false;
      let muted = false;
      let score = 0;
      let level = 1;
      const maxLevels = 5;
      const goalPerLevel = 500;
      let items = [];
      let popups = [];
      let flakes = [];
      let spawnTimer = 0;
      let playerX = 155;
      const playerW = 86;
      const playerH = 32;
      let audioCtx = null;
      let songTimer = null;
      let noteIndex = 0;

      const levelMessages = {
        1: {
          title: "Level 1 Complete! 🎉",
          msg: "First $500 stuffed! Small daily deposits turn into big holiday peace of mind."
        },
        2: {
          title: "Level 2 Complete! 🌟",
          msg: "$1,000 saved! Every envelope you fill brings you closer to a debt-free Christmas."
        },
        3: {
          title: "Level 3 Complete! 🎄",
          msg: "$1,500 stashed! Consistency beats perfection—your future self is cheering you on!"
        },
        4: {
          title: "Level 4 Complete! 👑",
          msg: "$2,000 banked! One final stretch to hit your ultimate $2,500 Cash Queen goal!"
        }
      };

      const N = {
        C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
      };
      const jingleBells = [
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.G5, 1], [N.C5, 1.5], [N.D5, 0.5], [N.E5, 4],
        [N.F5, 1], [N.F5, 1], [N.F5, 1.5], [N.F5, 0.5],
        [N.F5, 1], [N.E5, 1], [N.E5, 1], [N.E5, 0.5], [N.E5, 0.5],
        [N.E5, 1], [N.D5, 1], [N.D5, 1], [N.E5, 1], [N.D5, 2], [N.G5, 2],
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.G5, 1], [N.C5, 1.5], [N.D5, 0.5], [N.E5, 4],
        [N.F5, 1], [N.F5, 1], [N.F5, 1.5], [N.F5, 0.5],
        [N.F5, 1], [N.E5, 1], [N.E5, 1], [N.E5, 0.5], [N.E5, 0.5],
        [N.G5, 1], [N.G5, 1], [N.F5, 1], [N.D5, 1], [N.C5, 4]
      ];

      function ensureAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AC) audioCtx = new AC();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }

      function startMusic() {
        stopMusic();
        ensureAudio();
        noteIndex = 0;

        function playNextNote() {
          if (!running) return;
          const [freq, beats] = jingleBells[noteIndex];
          const sec = beats * 0.24;

          if (!muted && freq > 0 && audioCtx) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.07, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + sec * 0.92);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + sec);
          }

          noteIndex = (noteIndex + 1) % jingleBells.length;
          songTimer = setTimeout(playNextNote, sec * 1000);
        }

        playNextNote();
      }

      function stopMusic() {
        if (songTimer) {
          clearTimeout(songTimer);
          songTimer = null;
        }
      }

      muteBtn.addEventListener("click", () => {
        muted = !muted;
        muteBtn.textContent = muted ? "🔇" : "🔊";
      });

      for (let i = 0; i < 35; i++) {
        flakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 1.5 + Math.random() * 2.5,
          s: 0.45 + Math.random() * 0.75
        });
      }

      function playChime(type) {
        if (muted) return;
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === "bad") {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(95, now + 0.24);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "crown") {
          const notes = [1046.5, 1318.51, 1567.98, 2093.0];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const t = now + idx * 0.055;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.14, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.3);
          });
        } else if (type === "levelup") {
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const t = now + idx * 0.07;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.13, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.36);
          });
        } else {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(1046.5, now);
          osc.frequency.setValueAtTime(1318.5, now + 0.05);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      }

      wrap.addEventListener("pointermove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * canvas.width;
        playerX = Math.max(playerW / 2, Math.min(canvas.width - playerW / 2, x));
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") playerX = Math.max(playerW / 2, playerX - 28);
        if (e.key === "ArrowRight") playerX = Math.min(canvas.width - playerW / 2, playerX + 28);
      });
      function updateLivesUI() {
        livesEl.textContent = "❤️".repeat(Math.max(0, lives)) || "💔";
      }

      function addPopup(text, x, y, color) {
        popups.push({ text, x, y, color, alpha: 1 });
      }

      function handleLevelProgress() {
        const target = level * goalPerLevel;
        if (score < target) return;

        running = false;
        stopMusic();
        items = [];
        popups = [];
        playChime("levelup");

        if (level >= maxLevels) {
          overlay.innerHTML = `
            <div class="badge">👑 Cash Queen Champion 🎄</div>
            <h2>You Did It! $2,500 Saved!</h2>
            <div class="rules">
              <div class="good">🎉 All 5 Levels Completed!</div>
              <div class="tip">You dodged the debt, stuffed every envelope, and proved that small, steady steps build real financial freedom. Wishing you a joyful, stress-free Christmas!</div>
            </div>
            <button class="btn" id="restartBtn" type="button">Play Again</button>
          `;
          overlay.style.display = "flex";
          document.getElementById("restartBtn").addEventListener("click", startNewGame);
        } else {
          const info = levelMessages[level];
          const nextLv = level + 1;
          const bonusHeart = lives < 3 ? " (+1 ❤️ Restored!)" : "";
          if (lives < 3) {
            lives++;
            updateLivesUI();
          }

          overlay.innerHTML = `
            <div class="badge">🎅 North Country Cash Queen 🎄</div>
            <h2>${info.title}</h2>
            <div class="rules">
              <div class="good">Savings: $${score} / $${nextLv * goalPerLevel} Goal${bonusHeart}</div>
              <div class="tip">${info.msg}</div>
            </div>
            <button class="btn" id="nextLevelBtn" type="button">Start Level ${nextLv}</button>
          `;
          overlay.style.display = "flex";
          document.getElementById("nextLevelBtn").addEventListener("click", () => {
            level = nextLv;
            levelEl.textContent = level;
            resumeLevel();
          });
        }
      }

      function loseLife(reason, x, y) {
        lives--;
        playChime("bad");
        updateLivesUI();
        addPopup(reason, Math.max(58, Math.min(canvas.width - 58, x)), y, "#ffd166");

        wrap.classList.add("hurt");
        setTimeout(() => wrap.classList.remove("hurt"), 180);

        if (lives <= 0) {
          running = false;
          stopMusic();
          overlay.innerHTML = `
            <div class="badge">🎅 North Country Cash Queen 🎄</div>
            <h2>Merry Cash-Mas!</h2>
            <div class="rules">
              <div>${reason} (Reached Level ${level})</div>
              <div style="margin-top:6px; font-size:15px;">Holiday Savings: <span class="good">$${score}</span></div>
            </div>
            <button class="btn" id="restartBtn" type="button">Try Again</button>
          `;
          overlay.style.display = "flex";
          document.getElementById("restartBtn").addEventListener("click", startNewGame);
        }
      }

      function resumeLevel() {
        items = [];
        popups = [];
        spawnTimer = 0;
        running = true;
        overlay.style.display = "none";
        startMusic();
        requestAnimationFrame(loop);
      }

      function startNewGame() {
        score = 0;
        level = 1;
        lives = 3;
        scoreEl.textContent = "0";
        levelEl.textContent = "1";
        updateLivesUI();
        resumeLevel();
      }

      startBtn.addEventListener("click", startNewGame);

      function spawnItem() {
        const levelBoost = (level - 1) * 0.25;
        const debtChance = 0.24 + (level - 1) * 0.025;
        const roll = Math.random();

        if (roll < debtChance) {
          items.push({
            type: "debt",
            x: 28 + Math.random() * (canvas.width - 56),
            y: -20,
            speed: 1.65 + Math.random() * 0.75 + levelBoost
          });
        } else if (roll < debtChance + 0.11) {
          items.push({
            type: "crown",
            icon: "👑",
            value: 50,
            x: 28 + Math.random() * (canvas.width - 56),
            y: -20,
            speed: 2.0 + Math.random() * 0.7 + levelBoost
          });
        } else {
          items.push({
            type: "cash",
            icon: "💵",
            value: 10,
            x: 28 + Math.random() * (canvas.width - 56),
            y: -20,
            speed: 1.65 + Math.random() * 0.75 + levelBoost
          });
        }
      }

      function drawBackground() {
        ctx.fillStyle = "rgba(255, 209, 102, 0.75)";
        ctx.font = "11px sans-serif";
        ctx.fillText("✨", 35, 58);
        ctx.fillText("✨", 265, 72);
        ctx.fillText("✨", 150, 48);

        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        flakes.forEach((f) => {
          f.y += f.s;
          if (f.y > canvas.height) f.y = -5;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        for (let tx = 18; tx < canvas.width; tx += 38) {
          ctx.fillText("🎄", tx, canvas.height - 6);
        }
      }

      function drawRoundedBox(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawFestiveBinder(x, y) {
        ctx.save();
        ctx.translate(x - playerW / 2, y);
        ctx.fillStyle = "#c1121f";
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2.5;
        drawRoundedBox(0, 0, playerW, playerH, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px Quicksand, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🎅 BINDER 🎄", playerW / 2, 20);
        ctx.restore();
      }

      function loop() {
        if (!running) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        const spawnRate = Math.max(36, 48 - (level - 1) * 3);
        spawnTimer++;
        if (spawnTimer > spawnRate) {
          spawnItem();
          spawnTimer = 0;
        }

        const catchY = canvas.height - 56;
        drawFestiveBinder(playerX, catchY);

        ctx.textAlign = "center";

        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.y += it.speed;

          if (it.type === "debt") {
            ctx.save();
            ctx.fillStyle = "#d90429";
            ctx.strokeStyle = "#ffd166";
            ctx.lineWidth = 2;
            drawRoundedBox(it.x - 24, it.y - 16, 48, 22, 11);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px Quicksand, sans-serif";
            ctx.fillText("DEBT", it.x, it.y - 1);
            ctx.restore();
          } else if (it.type === "crown") {
            ctx.save();
            ctx.shadowColor = "#ffd166";
            ctx.shadowBlur = 14;
            ctx.font = "28px sans-serif";
            ctx.fillText(it.icon, it.x, it.y);
            ctx.restore();
          } else {
            ctx.font = "26px sans-serif";
            ctx.fillText(it.icon, it.x, it.y);
          }

          if (
            it.y >= catchY &&
            it.y <= catchY + playerH + 10 &&
            Math.abs(it.x - playerX) < playerW / 2 + 12
          ) {
            items.splice(i, 1);
            if (it.type === "debt") {
              loseLife("Hit Debt! -1❤️", it.x, catchY - 10);
            } else if (it.type === "crown") {
              score += 50;
              scoreEl.textContent = score;
              playChime("crown");
              addPopup("+$50 QUEEN! 👑", it.x, catchY - 10, "#ffd166");
              handleLevelProgress();
            } else {
              score += 10;
              scoreEl.textContent = score;
              playChime("cash");
              addPopup("+$10 🎄", it.x, catchY - 10, "#ffd166");
              handleLevelProgress();
            }
            if (!running) return;
            continue;
          }

          if (it.y > canvas.height - 15) {
            items.splice(i, 1);
            if (it.type === "cash") {
              loseLife("Missed a Note! -1❤️", it.x, canvas.height - 35);
              if (!running) return;
            }
          }
        }

        for (let i = popups.length - 1; i >= 0; i--) {
          const p = popups[i];
          p.y -= 0.9;
          p.alpha -= 0.022;
          if (p.alpha <= 0) {
            popups.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.font = "bold 13px Quicksand, sans-serif";
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
          ctx.restore();
        }

        requestAnimationFrame(loop);
      }
    })();
  </script>
</body>
</html>
