<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Cute 3D Dice</title>
  <style>
    body {
      font-family: "Quicksand", "Trebuchet MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scene {
      width: 96px;
      height: 96px;
      perspective: 500px;
      cursor: pointer;
      user-select: none;
      z-index: 2;
      transition: transform 0.25s ease;
    }

    .scene:hover {
      transform: scale(1.06);
    }

    .scene.tossing {
      animation: tossBounce 2.2s cubic-bezier(0.25, 0.85, 0.35, 1);
    }

    @keyframes tossBounce {
      0%   { transform: translateY(0) scale(1); }
      25%  { transform: translateY(-34px) scale(1.12); }
      55%  { transform: translateY(4px) scale(0.97); }
      75%  { transform: translateY(-12px) scale(1.03); }
      90%  { transform: translateY(2px) scale(0.99); }
      100% { transform: translateY(0) scale(1); }
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-22deg) rotateY(28deg);
      transition: transform 2.2s cubic-bezier(0.15, 0.88, 0.28, 1);
    }

    .face {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-sizing: border-box;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      background:
        radial-gradient(circle at 25% 20%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 45%),
        radial-gradient(circle, rgba(255, 255, 255, 0.85) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 215, 230, 0.9) 1px, transparent 1.5px),
        linear-gradient(145deg, #ffe5f0 0%, #ffb3d1 55%, #ff8fab 100%);
      background-size: 100% 100%, 18px 18px, 24px 24px, 100% 100%;
      background-position: 0 0, 0 0, 9px 11px, 0 0;
      border: 2.5px solid #ffd6e5;
      box-shadow:
        inset 0 3px 8px rgba(255, 255, 255, 0.95),
        inset 0 -5px 10px rgba(214, 51, 108, 0.25);
      backface-visibility: hidden;
    }

    .front  { transform: rotateY(0deg) translateZ(48px); }
    .back   { transform: rotateY(180deg) translateZ(48px); }
    .right  { transform: rotateY(90deg) translateZ(48px); }
    .left   { transform: rotateY(-90deg) translateZ(48px); }
    .top    { transform: rotateX(90deg) translateZ(48px); }
    .bottom { transform: rotateX(-90deg) translateZ(48px); }

    .heart {
      align-self: center;
      justify-self: center;
      font-size: 16px;
      line-height: 1;
      color: #e61960;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(230, 25, 96, 0.35);
    }

    .front .heart {
      font-size: 24px;
    }

    .p1 { grid-area: 1 / 1; }
    .p2 { grid-area: 1 / 3; }
    .p3 { grid-area: 2 / 1; }
    .p4 { grid-area: 2 / 2; }
    .p5 { grid-area: 2 / 3; }
    .p6 { grid-area: 3 / 1; }
    .p7 { grid-area: 3 / 3; }

    .floor-shadow {
      width: 78px;
      height: 16px;
      margin-top: 18px;
      background: radial-gradient(ellipse at center, rgba(230, 25, 96, 0.32) 0%, rgba(230, 25, 96, 0) 72%);
      border-radius: 50%;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .floor-shadow.tossing {
      animation: shadowPulse 2.2s ease;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      25%      { transform: scale(0.6); opacity: 0.4; }
      55%      { transform: scale(1.05); opacity: 1; }
      75%      { transform: scale(0.8); opacity: 0.65; }
    }

    .label {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #e63973;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="scene" id="scene" onclick="rollDice()" title="Click to roll!">
      <div class="cube" id="cube">
        <!-- 1 -->
        <div class="face front">
          <span class="heart p4">♥</span>
        </div>
        <!-- 6 -->
        <div class="face back">
          <span class="heart p1">♥</span><span class="heart p2">♥</span>
          <span class="heart p3">♥</span><span class="heart p5">♥</span>
          <span class="heart p6">♥</span><span class="heart p7">♥</span>
        </div>
        <!-- 3 -->
        <div class="face right">
          <span class="heart p1">♥</span>
          <span class="heart p4">♥</span>
          <span class="heart p7">♥</span>
        </div>
        <!-- 4 -->
        <div class="face left">
          <span class="heart p1">♥</span><span class="heart p2">♥</span>
          <span class="heart p6">♥</span><span class="heart p7">♥</span>
        </div>
        <!-- 2 -->
        <div class="face top">
          <span class="heart p1">♥</span>
          <span class="heart p7">♥</span>
        </div>
        <!-- 5 -->
        <div class="face bottom">
          <span class="heart p1">♥</span><span class="heart p2">♥</span>
          <span class="heart p4">♥</span>
          <span class="heart p6">♥</span><span class="heart p7">♥</span>
        </div>
      </div>
    </div>
    <div class="floor-shadow" id="shadow"></div>
    <div class="label">✨ tap to roll ✨</div>
  </div>

  <script>
    let spins = 0;
    let audioCtx = null;
    let noiseBuffer = null;

    function initAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContext();
        // Create short white-noise buffer for realistic acrylic/wood clack texture
        const bufferSize = audioCtx.sampleRate * 0.04;
        noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.008));
        }
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function triggerClack(time, volume, pitch) {
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;

      // Bandpass filter shapes the noise into a hard plastic/resin "clack"
      const filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(pitch, time);
      filter.Q.setValueAtTime(3.2, time);

      // High-shelf boost adds crisp edge-hit snap
      const highShelf = audioCtx.createBiquadFilter();
      highShelf.type = "highshelf";
      highShelf.frequency.setValueAtTime(2200, time);
      highShelf.gain.setValueAtTime(6, time);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(volume, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);

      noise.connect(filter);
      filter.connect(highShelf);
      highShelf.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(time);
      noise.stop(time + 0.04);
    }

    function playRollSound() {
      initAudio();
      const now = audioCtx.currentTime;

      // Irregular tumbling hits + tiny double-taps as corners/edges strike the table
      const hits = [
        { t: 0.02, v: 0.85 }, { t: 0.06, v: 0.45 },
        { t: 0.14, v: 0.90 }, { t: 0.19, v: 0.50 },
        { t: 0.29, v: 0.80 }, { t: 0.34, v: 0.40 },
        { t: 0.46, v: 0.75 }, { t: 0.52, v: 0.35 },
        { t: 0.67, v: 0.85 }, { t: 0.73, v: 0.45 }, // First bounce landing
        { t: 0.91, v: 0.65 }, { t: 0.97, v: 0.30 },
        { t: 1.18, v: 0.55 }, { t: 1.24, v: 0.25 },
        { t: 1.48, v: 0.45 },
        { t: 1.78, v: 0.32 },
        { t: 2.08, v: 0.22 }  // Final settle tap
      ];

      hits.forEach((hit) => {
        const randomPitch = 1450 + Math.random() * 850;
        triggerClack(now + hit.t, hit.v, randomPitch);
      });
    }

    function rollDice() {
      playRollSound();

      const cube = document.getElementById("cube");
      const scene = document.getElementById("scene");
      const shadow = document.getElementById("shadow");
      const roll = Math.floor(Math.random() * 6) + 1;
      spins += 3;

      scene.classList.remove("tossing");
      shadow.classList.remove("tossing");
      void scene.offsetWidth;
      scene.classList.add("tossing");
      shadow.classList.add("tossing");

      const targets = {
        1: { x: -18, y: 22 },
        2: { x: -108, y: 22 },
        3: { x: -18, y: -68 },
        4: { x: -18, y: 112 },
        5: { x: 72, y: 22 },
        6: { x: -18, y: 202 }
      };

      const extra = spins * 360;
      const t = targets[roll];
      cube.style.transform = `rotateX(${t.x + extra}deg) rotateY(${t.y + extra}deg)`;
    }
  </script>
</body>
</html>
