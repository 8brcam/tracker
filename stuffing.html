<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Country Cash Queen - Cash Stuffing Dash</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Quicksand", "Trebuchet MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-frame {
      position: relative;
      width: 280px;
      height: 220px;
      border-radius: 24px;
      padding: 8px;
      background: linear-gradient(145deg, #fff0f6 0%, #ffb3d1 55%, #ff8fab 100%);
      border: 2.5px solid #ffd166;
      box-shadow:
        0 12px 24px rgba(230, 25, 96, 0.22),
        inset 0 3px 8px rgba(255, 255, 255, 0.95),
        inset 0 -4px 10px rgba(214, 51, 108, 0.2);
    }

    .inner-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 17px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #ffffff 0%, #fff0f6 68%, #ffe0ec 100%);
      box-shadow: inset 0 2px 6px rgba(214, 51, 108, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 10px 10px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      color: #d61c5e;
      text-shadow: 0 1px 0 #ffffff;
      z-index: 2;
    }

    .hud-pill {
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid #ffd166;
      border-radius: 999px;
      padding: 2px 9px;
      box-shadow: 0 2px 6px rgba(230, 25, 96, 0.12);
    }

    .bill-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cash-bill {
      width: 146px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fff8fb 0%, #ffe0ec 50%, #ffc2d9 100%);
      border: 2px dashed #e61960;
      box-shadow:
        0 6px 14px rgba(230, 25, 96, 0.18),
        inset 0 0 0 3px #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    .cash-bill.pop {
      animation: billPop 0.22s cubic-bezier(0.25, 0.9, 0.35, 1.2);
    }

    .cash-bill.shake {
      animation: billShake 0.26s ease;
    }

    @keyframes billPop {
      0% { transform: scale(0.75) rotate(-4deg); opacity: 0.4; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes billShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .bill-amount {
      font-size: 19px;
      font-weight: 800;
      color: #e61960;
      line-height: 1.1;
    }

    .bill-tag {
      font-size: 11px;
      font-weight: 800;
      color: #a62655;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .envelopes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .env-btn {
      background: linear-gradient(180deg, #ffffff 0%, #ffe5f0 100%);
      border: 1.5px solid #ffd166;
      border-radius: 12px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(230, 25, 96, 0.14);
      transition: transform 0.1s ease, background 0.15s ease;
      font-family: inherit;
    }

    .env-btn:active {
      transform: scale(0.93);
    }

    .env-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    .env-name {
      font-size: 9.5px;
      font-weight: 800;
      color: #d61c5e;
      margin-top: 2px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px;
      background: rgba(255, 240, 246, 0.9);
      backdrop-filter: blur(2px);
      z-index: 6;
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-icon {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .overlay-title {
      font-size: 15px;
      font-weight: 800;
      color: #e61960;
      margin-bottom: 4px;
    }

    .overlay-sub {
      font-size: 10.5px;
      font-weight: 700;
      color: #b53864;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .action-btn {
      background: linear-gradient(145deg, #ffe5f0, #ffb3d1);
      border: 1.5px solid #ffd166;
      color: #d61c5e;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(230, 25, 96, 0.22);
    }

    .controls {
      margin-top: 10px;
    }

    .label {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #e63973;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card-frame">
      <div class="inner-card">
        <div class="hud">
          <div class="hud-pill">💵 Stuffed: $<span id="scoreVal">0</span></div>
          <div class="hud-pill">⏳ <span id="timeVal">25</span>s</div>
        </div>

        <div class="bill-stage">
          <div class="cash-bill" id="cashBill">
            <div class="bill-amount" id="billAmount">$20</div>
            <div class="bill-tag" id="billTag">☕ Coffee Fund</div>
          </div>
        </div>

        <div class="envelopes">
          <button class="env-btn" onclick="stuffEnvelope('coffee')">
            <span class="env-icon">☕</span>
            <span class="env-name">Coffee</span>
          </button>
          <button class="env-btn" onclick="stuffEnvelope('holiday')">
            <span class="env-icon">🎄</span>
            <span class="env-name">Holiday</span>
          </button>
          <button class="env-btn" onclick="stuffEnvelope('savings')">
            <span class="env-icon">🐷</span>
            <span class="env-name">Savings</span>
          </button>
        </div>

        <div class="overlay" id="overlayScreen">
          <div class="overlay-icon" id="overlayIcon">📒</div>
          <div class="overlay-title" id="overlayTitle">Cash Stuffing Dash</div>
          <div class="overlay-sub" id="overlaySub">
            Tap the matching binder envelope<br />
            to stuff as much cash as you can!
          </div>
          <button class="action-btn" id="startBtn" onclick="startGame()">✨ Start Stuffing</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="label" id="statusLabel">✨ tap the matching binder envelope ✨</div>
    </div>
  </div>

  <script>
    const scoreVal = document.getElementById("scoreVal");
    const timeVal = document.getElementById("timeVal");
    const cashBill = document.getElementById("cashBill");
    const billAmount = document.getElementById("billAmount");
    const billTag = document.getElementById("billTag");
    const overlayScreen = document.getElementById("overlayScreen");
    const overlayIcon = document.getElementById("overlayIcon");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySub = document.getElementById("overlaySub");
    const startBtn = document.getElementById("startBtn");
    const statusLabel = document.getElementById("statusLabel");

    const categories = new Array(
      { key: "coffee", label: "☕ Coffee Fund" },
      { key: "coffee", label: "🧋 Iced Latte" },
      { key: "holiday", label: "🎄 Christmas" },
      { key: "holiday", label: "🎁 Gift Binder" },
      { key: "savings", label: "🐷 Emergency" },
      { key: "savings", label: "👑 Cash Queen" }
    );

    const denominations = new Array(5, 10, 20, 50);

    let audioCtx = null;
    let score = 0;
    let timeLeft = 25;
    let streak = 0;
    let currentBill = null;
    let timerInterval = null;
    let gameActive = false;

    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function playChime(correct) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = correct ? "sine" : "triangle";
      osc.frequency.setValueAtTime(correct ? 780 + Math.min(streak * 35, 420) : 190, now);
      osc.frequency.exponentialRampToValueAtTime(correct ? 1240 : 120, now + 0.14);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    }
    function nextBill() {
      const cat = categories.at(Math.floor(Math.random() * categories.length));
      const amt = denominations.at(Math.floor(Math.random() * denominations.length));
      currentBill = { key: cat.key, label: cat.label, amount: amt };

      billAmount.textContent = `$${amt}`;
      billTag.textContent = cat.label;

      cashBill.classList.remove("pop", "shake");
      void cashBill.offsetWidth;
      cashBill.classList.add("pop");
    }

    function stuffEnvelope(chosenKey) {
      if (!gameActive || !currentBill) return;

      if (chosenKey === currentBill.key) {
        streak++;
        const bonus = streak >= 5 ? 5 : 0;
        score += currentBill.amount + bonus;
        scoreVal.textContent = score;
        playChime(true);

        statusLabel.textContent = streak >= 5
          ? `🔥 ${streak}x streak! +$${bonus} bonus!`
          : `✨ stuffed $${currentBill.amount} into ${chosenKey}! ✨`;

        nextBill();
      } else {
        streak = 0;
        playChime(false);
        statusLabel.textContent = "💔 wrong binder envelope! try again!";
        cashBill.classList.remove("pop", "shake");
        void cashBill.offsetWidth;
        cashBill.classList.add("shake");
      }
    }

    function startGame() {
      initAudio();
      score = 0;
      timeLeft = 25;
      streak = 0;
      gameActive = true;

      scoreVal.textContent = score;
      timeVal.textContent = timeLeft;
      overlayScreen.classList.add("hidden");
      statusLabel.textContent = "✨ tap the matching binder envelope ✨";

      nextBill();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timeVal.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      overlayIcon.textContent = "👑";
      overlayTitle.textContent = `You Stuffed $${score}!`;
      overlaySub.textContent = "Your cash binder is officially thriving 💖";
      startBtn.textContent = "↻ Stuff Again";
      overlayScreen.classList.remove("hidden");
      statusLabel.textContent = "🎀 merry cash stuffing, queen! 🎀";
    }
  </script>
</body>
</html>
