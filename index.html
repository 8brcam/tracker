<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueVerse Trajectory Pathfinder</title>
  
  <!-- PART 1: The Design Framework (Tailwind CSS CDN) -->
  <script src="https://tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col items-center justify-center bg-slate-950/95 p-4 font-sans text-slate-100 antialiased">

  <!-- PART 2: The Interface Layout (HTML) -->
  <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/80 p-5 shadow-2xl backdrop-blur-xl">
    <div class="mb-4 text-center">
      <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
        Trajectory Path Finder
      </h1>
      <p class="mt-1 text-xs text-slate-400">
        Click and drag on the grid below to trace and lock your vector geometry paths.
      </p>
    </div>

    <!-- The Interactive Vector Canvas -->
    <div class="relative overflow-hidden rounded-xl border-2 border-slate-800 bg-black shadow-inner">
      <!-- Background grid layout for matching physical table markers -->
      <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:40px_40px] opacity-30"></div>
      
      <canvas id="overlayCanvas" width="400" height="250" class="relative block w-full cursor-crosshair"></canvas>
    </div>

    <!-- Active Control Tray -->
    <div class="mt-4 flex items-center justify-between gap-2">
      <div class="font-mono text-[10px] text-slate-500 uppercase">
        Vectors: <span id="vectorStatus" class="text-cyan-400">Ready</span>
      </div>
      <button id="clearBtn" class="rounded-lg bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-200 border border-slate-700/60 hover:bg-slate-700 hover:text-white active:scale-95 transition-all">
        Clear Lines
      </button>
    </div>
  </div>

  <!-- PART 3: The Logic Engine (JavaScript) -->
  <script>
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');
    const statusLabel = document.getElementById('vectorStatus');

    let startX = 0;
    let startY = 0;
    let isDrawing = false;
    let lines = []; // Memory cache to hold persistent paths

    // Redraw Loop to maintain layout vectors
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render permanently stored vectors
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#00ffff'; // High-contrast neon cyan
      
      lines.forEach(line => {
        ctx.beginPath();
        ctx.moveTo(line.x1, line.y1);
        ctx.lineTo(line.x2, line.y2);
        ctx.stroke();
      });
    }

    // Capture cursor click-down coordinates
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      startX = (e.clientX - rect.left) * (canvas.width / rect.width);
      startY = (e.clientY - rect.top) * (canvas.height / rect.height);
      isDrawing = true;
      statusLabel.innerText = "Drawing...";
    });

    // Handle real-time dragging updates
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;

      const rect = canvas.getBoundingClientRect();
      const currentX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const currentY = (e.clientY - rect.top) * (canvas.height / rect.height);

      draw(); // Render existing lines first

      // Draw the real-time temporary line preview
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(currentX, currentY);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)'; // semi-transparent cyan
      ctx.stroke();
    });

    // Lock vector path into memory array upon mouse release
    window.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      statusLabel.innerText = "Active";

      const rect = canvas.getBoundingClientRect();
      const endX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const endY = (e.clientY - rect.top) * (canvas.height / rect.height);

      // Push vector data coordinates to the persistence cache
      lines.push({ x1: startX, y1: startY, x2: endX, y2: endY });
      draw();
    });

    // Reset logic
    clearBtn.addEventListener('click', () => {
      lines = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      statusLabel.innerText = "Ready";
    });
  </script>
</body>
</html>
