<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Country Cash Queen - Pink Christmas Fortune Scratch Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Quicksand", "Trebuchet MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-frame {
      position: relative;
      width: 266px;
      height: 156px;
      border-radius: 24px;
      padding: 8px;
      background: linear-gradient(145deg, #fff0f6 0%, #ffb3d1 55%, #ff8fab 100%);
      border: 2.5px solid #ffd166;
      box-shadow:
        0 12px 24px rgba(230, 25, 96, 0.22),
        inset 0 3px 8px rgba(255, 255, 255, 0.95),
        inset 0 -4px 10px rgba(214, 51, 108, 0.2);
    }

    .card-frame.revealed {
      animation: popCelebrate 0.6s cubic-bezier(0.25, 0.85, 0.35, 1);
    }

    @keyframes popCelebrate {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      70% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    .inner-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 17px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #fff0f6 68%, #ffe0ec 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(214, 51, 108, 0.15);
    }

    .prize-content {
      text-align: center;
      padding: 12px 16px;
      color: #e61960;
      z-index: 1;
      pointer-events: none;
      visibility: hidden;
    }

    .prize-content.ready {
      visibility: visible;
    }

    .prize-icon {
      font-size: 30px;
      line-height: 1.1;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 4px rgba(230, 25, 96, 0.25));
    }

    .prize-text {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 0 #ffffff;
    }

    .prize-sub {
      font-size: 11px;
      font-weight: 700;
      color: #ff5c93;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 250px;
      height: 140px;
      z-index: 5;
      cursor: crosshair;
      touch-action: none;
    }

    canvas.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #e63973;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);
    }

    .reset-btn {
      background: linear-gradient(145deg, #ffe5f0, #ffb3d1);
      border: 1.5px solid #ffd166;
      color: #d61c5e;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(230, 25, 96, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      opacity: 0;
      pointer-events: none;
    }

    .reset-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card-frame" id="cardFrame">
      <div class="inner-card">
        <div class="prize-content" id="prizeContent">
          <div class="prize-icon" id="prizeIcon">🎄</div>
          <div class="prize-text" id="prizeText">Santa's VIP Queen</div>
          <div class="prize-sub" id="prizeSub">You’re officially on the Nice List!</div>
        </div>
        <canvas id="foilCanvas" width="250" height="140"></canvas>
      </div>
    </div>

    <div class="controls">
      <div class="label" id="statusLabel">✨ rub gold foil to scratch ✨</div>
      <button class="reset-btn" id="resetBtn" onclick="resetCard()">↻ scratch another</button>
    </div>
  </div>
  <script>
    const fortunes = [
      { icon: "👑", text: "Santa's VIP Queen", sub: "You’re officially on the Nice List!" },
      { icon: "☕", text: "Pink Peppermint Mocha", sub: "Go grab your favorite cozy sip" },
      { icon: "❄️", text: "North Country Magic", sub: "A cozy winter miracle is on the way" },
      { icon: "🎀", text: "Christmas Cash Queen", sub: "Your holiday savings are glowing!" },
      { icon: "🍪", text: "Sugar Cookie Luck", sub: "Santa left an extra sweet treat for you" },
      { icon: "✨", text: "Mistletoe Miracle", sub: "Something magical will happen today" },
      { icon: "🎁", text: "Wrapped in Pink", sub: "The best gift this season is YOU" },
      { icon: "🕯️", text: "Vanilla Pine Glow", sub: "Light a cozy candle & take a deep breath" },
      { icon: "🦌", text: "Rudolph's Guidance", sub: "Your brightest ideas are leading the way" },
      { icon: "🧸", text: "Cozy Cabin Era", sub: "Wrap up in your fuzziest pink blanket" },
      { icon: "🌟", text: "North Star Wish", sub: "Make a wish—luck is on your side" },
      { icon: "🧁", text: "Frosted Cupcake O'Clock", sub: "Life is short, eat the Christmas treat" },
      { icon: "💌", text: "Holiday Secret Admirer", sub: "Someone is extra thankful for you today" },
      { icon: "🔔", text: "Jingle Bell Joy", sub: "Good news is ringing your way soon!" },
      { icon: "🍒", text: "Sugarplum Cheer", sub: "Today just got a whole lot sweeter" },
      { icon: "🧖‍♀️", text: "Winter Spa Pass", sub: "Permission to pamper yourself tonight" },
      { icon: "🍀", text: "Lucky Yule Charm", sub: "Extra holiday luck sprinkled on your week" },
      { icon: "🩰", text: "Pretty in Pinkmas", sub: "Christmas always looks better in pink" },
      { icon: "🌙", text: "Silent Night Peace", sub: "A calm, dreamy season awaits you" },
      { icon: "🎶", text: "Christmas Carol Break!", sub: "Put on your favorite holiday song right now" },
      { icon: "🍯", text: "Sweet as Candy Cane", sub: "Keep spreading that festive kindness" },
      { icon: "🏔️", text: "Snowy Mountain Air", sub: "Fresh snow, fresh start, clear mind" },
      { icon: "🧦", text: "Stocking Stuffer Luck", sub: "A cute little surprise is headed your way" },
      { icon: "🥂", text: "Pink Champagne Toast!", sub: "Cheers to crushing your savings goals" },
      { icon: "🦄", text: "Rare Snow Unicorn!", sub: "You pulled the rarest Christmas card!" },
      { icon: "🍩", text: "Festive Treat O'Clock", sub: "Zero guilt, 100% holiday cheer" },
      { icon: "💖", text: "Fireside Sparkle", sub: "You brighten every room you enter" },
      { icon: "💎", text: "Ice Queen Status", sub: "Shine bright like tinsel on the tree" },
      { icon: "🐱", text: "Cozy Kitty Snuggles", sub: "Sending warm holiday hugs your way" },
      { icon: "🎉", text: "Merry Cash-Mas!", sub: "Celebrate every little win this season!" }
    ];

    const canvas = document.getElementById("foilCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const cardFrame = document.getElementById("cardFrame");
    const prizeContent = document.getElementById("prizeContent");
    const statusLabel = document.getElementById("statusLabel");
    const resetBtn = document.getElementById("resetBtn");

    let isDrawing = false;
    let isRevealed = false;
    let lastPoint = null;
    let strokeCounter = 0;
    let lastIndex = -1;

    let audioCtx = null;
    let scratchNoiseNode = null;
    let scratchGain = null;

    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function startScratchSound() {
      initAudio();
      if (!audioCtx || scratchNoiseNode) return;

      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      scratchNoiseNode = audioCtx.createBufferSource();
      scratchNoiseNode.buffer = buffer;
      scratchNoiseNode.loop = true;

      const bandpass = audioCtx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.setValueAtTime(3600, audioCtx.currentTime);
      bandpass.Q.setValueAtTime(1.8, audioCtx.currentTime);

      scratchGain = audioCtx.createGain();
      scratchGain.gain.setValueAtTime(0.001, audioCtx.currentTime);

      scratchNoiseNode.connect(bandpass);
      bandpass.connect(scratchGain);
      scratchGain.connect(audioCtx.destination);
      scratchNoiseNode.start();
    }

    function updateScratchVolume(active) {
      if (!scratchGain || !audioCtx) return;
      const now = audioCtx.currentTime;
      scratchGain.gain.cancelScheduledValues(now);
      scratchGain.gain.setTargetAtTime(active ? 0.14 : 0.0001, now, 0.02);
    }

    function playSparkleChime() {
      initAudio();
      if (!audioCtx) return;
      const notes = [880, 1108.73, 1318.51, 1760];
      const now = audioCtx.currentTime;
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + idx * 0.065);
        gain.gain.setValueAtTime(0.001, now + idx * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.12, now + idx * 0.065 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.065 + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.065);
        osc.stop(now + idx * 0.065 + 0.5);
      });
    }
    function setupCanvas() {
      const w = canvas.width;
      const h = canvas.height;

      ctx.globalCompositeOperation = "source-over";
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#e6b84c");
      grad.addColorStop(0.3, "#ffe082");
      grad.addColorStop(0.5, "#fff3b0");
      grad.addColorStop(0.75, "#f4c44e");
      grad.addColorStop(1, "#d49b27");

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 160; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 1.4 + 0.4;
        ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.85)" : "rgba(230,25,96,0.25)";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#d61c5e";
      ctx.font = "bold 12px 'Quicksand', 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🎄 SCRATCH FOR XMAS LUCK 🎄", w / 2, h / 2);
    }

    function pickRandomFortune() {
      let idx;
      do {
        idx = Math.floor(Math.random() * fortunes.length);
      } while (idx === lastIndex && fortunes.length > 1);
      lastIndex = idx;

      const item = fortunes[idx];
      document.getElementById("prizeIcon").textContent = item.icon;
      document.getElementById("prizeText").textContent = item.text;
      document.getElementById("prizeSub").textContent = item.sub;
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function scratchAt(from, to) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 34;

      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      strokeCounter++;
      if (strokeCounter % 6 === 0 && !isRevealed) checkRevealProgress();
    }

    function checkRevealProgress() {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let cleared = 0;
      const step = 32;
      for (let i = 3; i < imgData.length; i += step) {
        if (imgData[i] === 0) cleared++;
      }
      if (cleared / (imgData.length / step) > 0.45) revealCard();
    }

    function revealCard() {
      isRevealed = true;
      updateScratchVolume(false);
      canvas.classList.add("fade-out");
      cardFrame.classList.add("revealed");
      statusLabel.textContent = "🎀 merry pinkmas! 🎄";
      resetBtn.classList.add("visible");
      playSparkleChime();
    }

    function resetCard() {
      isRevealed = false;
      strokeCounter = 0;
      prizeContent.classList.remove("ready");
      setupCanvas();
      canvas.classList.remove("fade-out");
      cardFrame.classList.remove("revealed");
      statusLabel.textContent = "✨ rub gold foil to scratch ✨";
      resetBtn.classList.remove("visible");
      pickRandomFortune();
      prizeContent.classList.add("ready");
    }

    function startScratch(e) {
      if (isRevealed) return;
      if (e.cancelable) e.preventDefault();
      if (e.pointerId !== undefined && canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      isDrawing = true;
      lastPoint = getCoords(e);
      startScratchSound();
      updateScratchVolume(true);
      scratchAt(lastPoint, { x: lastPoint.x + 0.1, y: lastPoint.y + 0.1 });
    }

    function moveScratch(e) {
      if (!isDrawing || isRevealed) return;
      if (e.cancelable) e.preventDefault();
      const currentPoint = getCoords(e);
      scratchAt(lastPoint, currentPoint);
      lastPoint = currentPoint;
    }

    function endScratch() {
      if (!isDrawing) return;
      isDrawing = false;
      lastPoint = null;
      updateScratchVolume(false);
      if (!isRevealed) checkRevealProgress();
    }

    canvas.addEventListener("pointerdown", startScratch);
    canvas.addEventListener("pointermove", moveScratch);
    canvas.addEventListener("pointerup", endScratch);
    canvas.addEventListener("pointercancel", endScratch);

    setupCanvas();
    pickRandomFortune();
    prizeContent.classList.add("ready");
  </script>
</body>
</html>
