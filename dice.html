<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Country Cash Queen - Christmas Edition</title>
  <style>
    body {
      font-family: "Quicksand", "Trebuchet MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: transparent;
      user-select: none;
      overflow: hidden;
    }

    .game-wrap {
      position: relative;
      width: 310px;
      height: 430px;
      border-radius: 26px;
      overflow: hidden;
      background: linear-gradient(180deg, #1b4332 0%, #2d6a4f 52%, #d8f3dc 88%, #ffffff 100%);
      border: 3.5px solid #ffd166;
      box-shadow: 0 12px 28px rgba(155, 34, 38, 0.3);
      touch-action: none;
      transition: box-shadow 0.15s ease;
      flex-shrink: 0;
    }

    .game-wrap.hurt {
      box-shadow: 0 0 0 4px #e63946, 0 12px 28px rgba(230, 57, 70, 0.55);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 13px;
      color: #9b2226;
      z-index: 2;
    }

    .pill {
      background: rgba(255, 255, 255, 0.95);
      padding: 5px 11px;
      border-radius: 14px;
      border: 2px solid #ffd166;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }

    .mute-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #ffd166;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      padding: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 250, 250, 0.94);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      color: #9b2226;
      z-index: 3;
    }

    .badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #1b4332;
      background: #d8f3dc;
      border: 1.5px solid #52b788;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .overlay h2 {
      margin: 0 0 12px;
      font-size: 21px;
      color: #9b2226;
    }

    .rules {
      background: #fff;
      border: 2px solid #ffd166;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.7;
      font-weight: 700;
    }

    .rules .good { color: #1b4332; }
    .rules .bad  { color: #d90429; }

    .btn {
      background: linear-gradient(135deg, #d90429, #9b2226);
      color: #fff;
      border: 2px solid #ffd166;
      padding: 11px 28px;
      border-radius: 22px;
      font-family: inherit;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(155, 34, 38, 0.35);
      transition: transform 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="game-wrap" id="wrap">
    <div class="hud">
      <div class="pill">🎄 £<span id="score">0</span></div>
      <div class="pill" id="lives">❤️❤️❤️</div>
      <button class="mute-btn" id="muteBtn" type="button" title="Toggle Music">🔊</button>
    </div>

    <canvas id="game" width="310" height="430"></canvas>

    <div class="overlay" id="overlay">
      <div class="badge">🎅 North Country Cash Queen 🎄</div>
      <h2>Christmas Cash Catch</h2>
      <div class="rules">
        <div class="good">✅ Catch every 💵 Note</div>
        <div class="bad">❌ Dodge the 🚫 Debt</div>
      </div>
      <button class="btn" id="startBtn" type="button">Play</button>
    </div>
  </div>
  <script>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("wrap");
      const overlay = document.getElementById("overlay");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const startBtn = document.getElementById("startBtn");
      const muteBtn = document.getElementById("muteBtn");

      function fitFrame() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        if (vw > 0 && vh > 0 && (vw < 320 || vh < 440)) {
          const s = Math.min((vw - 8) / 310, (vh - 8) / 430, 1);
          wrap.style.transform = "scale(" + s + ")";
          wrap.style.transformOrigin = "center center";
        } else {
          wrap.style.transform = "";
        }
      }
      fitFrame();
      window.addEventListener("resize", fitFrame);

      let running = false;
      let muted = false;
      let score = 0;
      let lives = 3;
      let items = [];
      let popups = [];
      let flakes = [];
      let spawnTimer = 0;
      let playerX = 155;
      const playerW = 86;
      const playerH = 32;
      let audioCtx = null;
      let songTimer = null;
      let noteIndex = 0;

      const N = {
        C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
      };
      const jingleBells = [
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.G5, 1], [N.C5, 1.5], [N.D5, 0.5], [N.E5, 4],
        [N.F5, 1], [N.F5, 1], [N.F5, 1.5], [N.F5, 0.5],
        [N.F5, 1], [N.E5, 1], [N.E5, 1], [N.E5, 0.5], [N.E5, 0.5],
        [N.E5, 1], [N.D5, 1], [N.D5, 1], [N.E5, 1], [N.D5, 2], [N.G5, 2],
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.E5, 1], [N.E5, 2],
        [N.E5, 1], [N.G5, 1], [N.C5, 1.5], [N.D5, 0.5], [N.E5, 4],
        [N.F5, 1], [N.F5, 1], [N.F5, 1.5], [N.F5, 0.5],
        [N.F5, 1], [N.E5, 1], [N.E5, 1], [N.E5, 0.5], [N.E5, 0.5],
        [N.G5, 1], [N.G5, 1], [N.F5, 1], [N.D5, 1], [N.C5, 4]
      ];

      function ensureAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AC) audioCtx = new AC();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }

      function startMusic() {
        stopMusic();
        ensureAudio();
        noteIndex = 0;

        function playNextNote() {
          if (!running) return;
          const [freq, beats] = jingleBells[noteIndex];
          const sec = beats * 0.24;

          if (!muted && freq > 0 && audioCtx) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.07, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + sec * 0.92);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + sec);
          }

          noteIndex = (noteIndex + 1) % jingleBells.length;
          songTimer = setTimeout(playNextNote, sec * 1000);
        }

        playNextNote();
      }

      function stopMusic() {
        if (songTimer) {
          clearTimeout(songTimer);
          songTimer = null;
        }
      }

      muteBtn.addEventListener("click", () => {
        muted = !muted;
        muteBtn.textContent = muted ? "🔇" : "🔊";
      });

      for (let i = 0; i < 35; i++) {
        flakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 1.5 + Math.random() * 2.5,
          s: 0.45 + Math.random() * 0.75
        });
      }

      function playChime(isBad) {
        if (muted) return;
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (isBad) {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(95, now + 0.24);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else {
          osc.type = "sine";
          osc.frequency.setValueAtTime(1046.5, now);
          osc.frequency.setValueAtTime(1318.5, now + 0.05);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      }

      wrap.addEventListener("pointermove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * canvas.width;
        playerX = Math.max(playerW / 2, Math.min(canvas.width - playerW / 2, x));
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") playerX = Math.max(playerW / 2, playerX - 28);
        if (e.key === "ArrowRight") playerX = Math.min(canvas.width - playerW / 2, playerX + 28);
      });
      function addPopup(text, x, y, color) {
        popups.push({ text, x, y, color, alpha: 1 });
      }

      function loseLife(reason, x, y) {
        lives--;
        playChime(true);
        livesEl.textContent = "❤️".repeat(Math.max(0, lives)) || "💔";
        addPopup(reason, Math.max(58, Math.min(canvas.width - 58, x)), y, "#ffd166");

        wrap.classList.add("hurt");
        setTimeout(() => wrap.classList.remove("hurt"), 180);

        if (lives <= 0) {
          running = false;
          stopMusic();
          overlay.innerHTML = `
            <div class="badge">🎅 North Country Cash Queen 🎄</div>
            <h2>Merry Cash-Mas!</h2>
            <div class="rules">
              <div>${reason}</div>
              <div style="margin-top:6px; font-size:16px;">Holiday Savings: <span class="good">£${score}</span></div>
            </div>
            <button class="btn" id="restartBtn" type="button">Play Again</button>
          `;
          overlay.style.display = "flex";
          document.getElementById("restartBtn").addEventListener("click", startGame);
        }
      }

      function startGame() {
        score = 0;
        lives = 3;
        items = [];
        popups = [];
        spawnTimer = 0;
        running = true;
        scoreEl.textContent = "0";
        livesEl.textContent = "❤️❤️❤️";
        overlay.style.display = "none";
        startMusic();
        requestAnimationFrame(loop);
      }

      startBtn.addEventListener("click", startGame);

      function spawnItem() {
        const isDebt = Math.random() < 0.3;
        items.push({
          icon: "💵",
          bad: isDebt,
          x: 28 + Math.random() * (canvas.width - 56),
          y: -20,
          speed: 1.7 + Math.random() * 0.9 + Math.min(score / 300, 1.4)
        });
      }

      function drawBackground() {
        ctx.fillStyle = "rgba(255, 209, 102, 0.75)";
        ctx.font = "11px sans-serif";
        ctx.fillText("✨", 35, 58);
        ctx.fillText("✨", 265, 72);
        ctx.fillText("✨", 150, 48);

        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        flakes.forEach((f) => {
          f.y += f.s;
          if (f.y > canvas.height) f.y = -5;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        for (let tx = 18; tx < canvas.width; tx += 38) {
          ctx.fillText("🎄", tx, canvas.height - 6);
        }
      }

      function drawRoundedBox(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawFestiveBinder(x, y) {
        ctx.save();
        ctx.translate(x - playerW / 2, y);
        ctx.fillStyle = "#c1121f";
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2.5;
        drawRoundedBox(0, 0, playerW, playerH, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px Quicksand, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🎅 BINDER 🎄", playerW / 2, 20);
        ctx.restore();
      }

      function loop() {
        if (!running) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        spawnTimer++;
        if (spawnTimer > 48) {
          spawnItem();
          spawnTimer = 0;
        }

        const catchY = canvas.height - 56;
        drawFestiveBinder(playerX, catchY);

        ctx.textAlign = "center";

        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.y += it.speed;

          if (it.bad) {
            ctx.save();
            ctx.fillStyle = "#d90429";
            ctx.strokeStyle = "#ffd166";
            ctx.lineWidth = 2;
            drawRoundedBox(it.x - 24, it.y - 16, 48, 22, 11);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px Quicksand, sans-serif";
            ctx.fillText("DEBT", it.x, it.y - 1);
            ctx.restore();
          } else {
            ctx.font = "26px sans-serif";
            ctx.fillText(it.icon, it.x, it.y);
          }

          if (
            it.y >= catchY &&
            it.y <= catchY + playerH + 10 &&
            Math.abs(it.x - playerX) < playerW / 2 + 12
          ) {
            items.splice(i, 1);
            if (it.bad) {
              loseLife("Hit Debt! -1❤️", it.x, catchY - 10);
            } else {
              score += 10;
              scoreEl.textContent = score;
              playChime(false);
              addPopup("+£10 🎄", it.x, catchY - 10, "#ffd166");
            }
            continue;
          }

          if (it.y > canvas.height - 15) {
            items.splice(i, 1);
            if (!it.bad) {
              loseLife("Missed a Note! -1❤️", it.x, canvas.height - 35);
            }
          }
        }

        for (let i = popups.length - 1; i >= 0; i--) {
          const p = popups[i];
          p.y -= 0.9;
          p.alpha -= 0.022;
          if (p.alpha <= 0) {
            popups.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.font = "bold 13px Quicksand, sans-serif";
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
          ctx.restore();
        }

        requestAnimationFrame(loop);
      }
    })();
  </script>
</body>
</html>
