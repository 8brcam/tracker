<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Cute Fortune Scratch Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Quicksand", "Trebuchet MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-frame {
      position: relative;
      width: 260px;
      height: 150px;
      border-radius: 24px;
      padding: 8px;
      background: linear-gradient(145deg, #fff0f6 0%, #ffb3d1 55%, #ff8fab 100%);
      border: 2.5px solid #ffd6e5;
      box-shadow:
        0 12px 24px rgba(230, 25, 96, 0.22),
        inset 0 3px 8px rgba(255, 255, 255, 0.95),
        inset 0 -4px 10px rgba(214, 51, 108, 0.2);
    }

    .card-frame.revealed {
      animation: popCelebrate 0.6s cubic-bezier(0.25, 0.85, 0.35, 1);
    }

    @keyframes popCelebrate {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      70% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    .inner-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 17px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #fff0f6 70%, #ffe0ec 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(214, 51, 108, 0.15);
    }

    .prize-content {
      text-align: center;
      padding: 12px 16px;
      color: #e61960;
      z-index: 1;
      pointer-events: none;
      visibility: hidden;
    }

    .prize-content.ready {
      visibility: visible;
    }

    .prize-icon {
      font-size: 30px;
      line-height: 1.1;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 4px rgba(230, 25, 96, 0.25));
    }

    .prize-text {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 0 #ffffff;
    }

    .prize-sub {
      font-size: 11px;
      font-weight: 700;
      color: #ff5c93;
      margin-top: 4px;
      letter-spacing: 0.4px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 244px;
      height: 134px;
      z-index: 5;
      cursor: crosshair;
      touch-action: none;
    }

    canvas.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #e63973;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .reset-btn {
      background: linear-gradient(145deg, #ffe5f0, #ffb3d1);
      border: 1.5px solid #ffd6e5;
      color: #d61c5e;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(230, 25, 96, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      opacity: 0;
      pointer-events: none;
    }

    .reset-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card-frame" id="cardFrame">
      <div class="inner-card">
        <div class="prize-content" id="prizeContent">
          <div class="prize-icon" id="prizeIcon">👑</div>
          <div class="prize-text" id="prizeText">Queen Vibes Only</div>
          <div class="prize-sub" id="prizeSub">You’re doing amazing sweetie</div>
        </div>
        <canvas id="foilCanvas" width="244" height="134"></canvas>
      </div>
    </div>

    <div class="controls">
      <div class="label" id="statusLabel">✨ rub to scratch ✨</div>
      <button class="reset-btn" id="resetBtn" onclick="resetCard()">↻ scratch another</button>
    </div>
  </div>
  <script>
    const fortunes = [
      { icon: "👑", text: "Queen Vibes Only", sub: "You’re doing amazing sweetie" },
      { icon: "☕", text: "Cozy Coffee Break", sub: "Go grab your favorite sip" },
      { icon: "🌲", text: "North Country Magic", sub: "Good luck is headed your way" },
      { icon: "🎀", text: "Certified Cutie", sub: "100% that Cash Queen" },
      { icon: "🍓", text: "Sweet Little Treat", sub: "You officially deserve a snack" },
      { icon: "✨", text: "Lucky Charm Unlocked", sub: "Something fun will happen today" },
      { icon: "💖", text: "Sending Sparkles", sub: "Thanks for stopping by!" },
      { icon: "🌸", text: "Soft Life Era", sub: "Take a deep breath & relax" },
      { icon: "🦋", text: "Main Character Energy", sub: "Today is all about you" },
      { icon: "🧸", text: "Cozy Cabin Mood", sub: "Wrap up in your fuzziest blanket" },
      { icon: "🌈", text: "Good Vibes Incoming", sub: "Smile—you look gorgeous today" },
      { icon: "🧁", text: "Cupcake O'Clock", sub: "Life is short, eat the frosting" },
      { icon: "💌", text: "Secret Admirer", sub: "Someone appreciates you a ton" },
      { icon: "🌟", text: "Golden Star Day", sub: "You are crushing your goals" },
      { icon: "🍒", text: "Cherry on Top", sub: "Today just got a whole lot sweeter" },
      { icon: "🧖‍♀️", text: "Self-Care Pass", sub: "Permission to pamper yourself" },
      { icon: "🍀", text: "Four-Leaf Clover", sub: "Extra luck sprinkled on your week" },
      { icon: "🩰", text: "Pretty in Pink", sub: "Everything looks better in pink" },
      { icon: "🌙", text: "Dream Big Tonight", sub: "Your future is looking bright" },
      { icon: "🎶", text: "Dance Break!", sub: "Put on your favorite throwback song" },
      { icon: "🍯", text: "Sweet as Honey", sub: "Keep spreading that kindness" },
      { icon: "🏔️", text: "Mountain Air Vibes", sub: "Fresh start, clear mind" },
      { icon: "🕯️", text: "Light Your Fav Candle", sub: "Instant cozy atmosphere unlocked" },
      { icon: "🍑", text: "Peachy Keen", sub: "Nothing can dull your sparkle" },
      { icon: "🦄", text: "Rare Unicorn Pull", sub: "You found the rarest card!" },
      { icon: "🍩", text: "Donut Worry", sub: "Everything is going to work out" },
      { icon: "🌻", text: "Pure Sunshine", sub: "You brighten every room you enter" },
      { icon: "💎", text: "Diamond Status", sub: "Shine bright like the queen you are" },
      { icon: "🐱", text: "Purr-fect Day", sub: "Sending virtual snuggles your way" },
      { icon: "🎉", text: "Confetti Moment", sub: "Celebrate the little wins today!" }
    ];

    const canvas = document.getElementById("foilCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const cardFrame = document.getElementById("cardFrame");
    const prizeContent = document.getElementById("prizeContent");
    const statusLabel = document.getElementById("statusLabel");
    const resetBtn = document.getElementById("resetBtn");

    let isDrawing = false;
    let isRevealed = false;
    let lastPoint = null;
    let strokeCounter = 0;
    let lastIndex = -1;

    let audioCtx = null;
    let scratchNoiseNode = null;
    let scratchGain = null;

    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function startScratchSound() {
      initAudio();
      if (!audioCtx || scratchNoiseNode) return;

      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      scratchNoiseNode = audioCtx.createBufferSource();
      scratchNoiseNode.buffer = buffer;
      scratchNoiseNode.loop = true;

      const bandpass = audioCtx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.setValueAtTime(3600, audioCtx.currentTime);
      bandpass.Q.setValueAtTime(1.8, audioCtx.currentTime);

      scratchGain = audioCtx.createGain();
      scratchGain.gain.setValueAtTime(0.001, audioCtx.currentTime);

      scratchNoiseNode.connect(bandpass);
      bandpass.connect(scratchGain);
      scratchGain.connect(audioCtx.destination);
      scratchNoiseNode.start();
    }

    function updateScratchVolume(active) {
      if (!scratchGain || !audioCtx) return;
      const now = audioCtx.currentTime;
      scratchGain.gain.cancelScheduledValues(now);
      scratchGain.gain.setTargetAtTime(active ? 0.14 : 0.0001, now, 0.02);
    }

    function playSparkleChime() {
      initAudio();
      if (!audioCtx) return;
      const notes = [880, 1108.73, 1318.51, 1760];
      const now = audioCtx.currentTime;
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + idx * 0.065);
        gain.gain.setValueAtTime(0.001, now + idx * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.12, now + idx * 0.065 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.065 + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.065);
        osc.stop(now + idx * 0.065 + 0.5);
      });
    }
    function setupCanvas() {
      const w = canvas.width;
      const h = canvas.height;

      ctx.globalCompositeOperation = "source-over";
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#ff9ebb");
      grad.addColorStop(0.35, "#ffcce0");
      grad.addColorStop(0.5, "#ffe6f0");
      grad.addColorStop(0.7, "#ff8fb3");
      grad.addColorStop(1, "#ff6b9d");

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 160; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 1.4 + 0.4;
        ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.75)" : "rgba(230,25,96,0.22)";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
      ctx.font = "bold 13px 'Quicksand', 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("♥  SCRATCH ME  ♥", w / 2, h / 2);
    }

    function pickRandomFortune() {
      let idx;
      do {
        idx = Math.floor(Math.random() * fortunes.length);
      } while (idx === lastIndex && fortunes.length > 1);
      lastIndex = idx;

      const item = fortunes[idx];
      document.getElementById("prizeIcon").textContent = item.icon;
      document.getElementById("prizeText").textContent = item.text;
      document.getElementById("prizeSub").textContent = item.sub;
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches && e.touches.length > 0 ? e.touches[0] : null;
      const clientX = touch ? touch.clientX : e.clientX;
      const clientY = touch ? touch.clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function scratchAt(from, to) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 34;

      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      strokeCounter++;
      if (strokeCounter % 6 === 0 && !isRevealed) checkRevealProgress();
    }

    function checkRevealProgress() {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let cleared = 0;
      const step = 32;
      for (let i = 3; i < imgData.length; i += step) {
        if (imgData[i] === 0) cleared++;
      }
      if (cleared / (imgData.length / step) > 0.45) revealCard();
    }

    function revealCard() {
      isRevealed = true;
      updateScratchVolume(false);
      canvas.classList.add("fade-out");
      cardFrame.classList.add("revealed");
      statusLabel.textContent = "✨ cute! ✨";
      resetBtn.classList.add("visible");
      playSparkleChime();
    }

    function resetCard() {
      isRevealed = false;
      strokeCounter = 0;
      prizeContent.classList.remove("ready");
      setupCanvas();
      canvas.classList.remove("fade-out");
      cardFrame.classList.remove("revealed");
      statusLabel.textContent = "✨ rub to scratch ✨";
      resetBtn.classList.remove("visible");
      pickRandomFortune();
      prizeContent.classList.add("ready");
    }

    function startScratch(e) {
      if (isRevealed) return;
      if (e.cancelable) e.preventDefault();
      isDrawing = true;
      lastPoint = getCoords(e);
      startScratchSound();
      updateScratchVolume(true);
      scratchAt(lastPoint, { x: lastPoint.x + 0.1, y: lastPoint.y + 0.1 });
    }

    function moveScratch(e) {
      if (!isDrawing || isRevealed) return;
      if (e.cancelable) e.preventDefault();
      const currentPoint = getCoords(e);
      scratchAt(lastPoint, currentPoint);
      lastPoint = currentPoint;
    }

    function endScratch() {
      if (!isDrawing) return;
      isDrawing = false;
      lastPoint = null;
      updateScratchVolume(false);
      if (!isRevealed) checkRevealProgress();
    }

    canvas.addEventListener("mousedown", startScratch);
    window.addEventListener("mousemove", moveScratch);
    window.addEventListener("mouseup", endScratch);

    canvas.addEventListener("touchstart", startScratch, { passive: false });
    canvas.addEventListener("touchmove", moveScratch, { passive: false });
    window.addEventListener("touchend", endScratch);
    window.addEventListener("touchcancel", endScratch);

    setupCanvas();
    pickRandomFortune();
    prizeContent.classList.add("ready");
  </script>
</body>
</html>
